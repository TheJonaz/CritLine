<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#5a1208"/>
      <stop offset="0.55" stop-color="#2a0806"/>
      <stop offset="1" stop-color="#0c0303"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.25" stop-color="#ffc83a"/>
      <stop offset="0.6" stop-color="#f05a12"/>
      <stop offset="1" stop-color="#a01208" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a12"/>
      <stop offset="0.5" stop-color="#ffd860"/>
      <stop offset="1" stop-color="#fff4c0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="0.5" stop-color="#9a6a1c"/>
      <stop offset="1" stop-color="#e8c060"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- crit burst -->
  <g transform="translate(300 232)">
    <circle r="190" fill="url(#burst)" opacity="0.55"/>
    <polygon fill="#f06a18" opacity="0.9" points="0,-200 26,-62 120,-160 64,-34 196,-56 74,8 180,92 52,52 70,184 4,70 -60,176 -40,48 -168,104 -68,0 -190,-70 -56,-40 -112,-160 -20,-60"/>
    <polygon fill="#ffc23a" points="0,-140 18,-44 84,-112 44,-24 136,-38 50,6 126,64 36,36 48,128 2,48 -42,122 -28,32 -116,72 -46,0 -132,-48 -38,-28 -78,-112 -14,-42"/>
    <circle r="46" fill="#fff3c4"/>
  </g>

  <!-- rising record line -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="70,420 150,356 196,384 262,286 304,314 382,170" stroke="#3a1004" stroke-width="44"/>
    <polyline points="70,420 150,356 196,384 262,286 304,314 382,170" stroke="url(#gold)" stroke-width="28"/>
  </g>
  <!-- arrowhead at the peak -->
  <polygon points="430,96 420,214 344,150" fill="url(#gold)" stroke="#3a1004" stroke-width="8" stroke-linejoin="round"/>

  <!-- spark on the record -->
  <g transform="translate(410 120)" fill="#ffffff">
    <polygon points="0,-46 9,-9 46,0 9,9 0,46 -9,9 -46,0 -9,-9"/>
  </g>

  <!-- frame -->
  <rect x="10" y="10" width="492" height="492" rx="18" fill="none" stroke="#120404" stroke-width="20"/>
  <rect x="16" y="16" width="480" height="480" rx="14" fill="none" stroke="url(#frame)" stroke-width="10"/>
</svg>
