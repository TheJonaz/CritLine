# Builds the addon with BigWigs Packager and uploads it to CurseForge, Wago and
# WoWInterface whenever a version tag (e.g. v4.7.1-forever11) is pushed. Uploads to a
# site only happen when its project ID is in the TOC files and its token is set as a secret.
name: Release

on:
  push:
    tags:
      - "v*"
  # manual test build: packages without uploading anywhere and keeps the zip as an artifact
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }}

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-package
          path: .release/*.zip
          include-hidden-files: true
